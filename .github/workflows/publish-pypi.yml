name: Publish Python package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip build twine
      - name: Verify synchronized release metadata
        run: python scripts/prepare_release.py "$RELEASE_TAG" --check
      - name: Retrieve classifier from the prepared draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern model.pkl.bz2 --pattern release-manifest.json --pattern SHA256SUMS --dir release-assets
      - name: Verify classifier and source commit
        run: |
          python scripts/download_release_model.py --output release-assets/model.pkl.bz2 --verify-only
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest = json.loads(Path("release-assets/release-manifest.json").read_text())
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip()
          assert manifest["source_commit"] == commit, "Release assets belong to a different source commit"
          PY
      - name: Run tests and load the release classifier
        run: |
          python -m pip install '.[test]'
          pytest -q
          python - <<'PY'
          from paleoveg import load_model
          from paleoveg.input import REQUIRED_COLUMNS
          from paleoveg.predictor import MODEL_CLASS_CODES
          model = load_model("release-assets/model.pkl.bz2")
          assert list(model.classes_) == MODEL_CLASS_CODES
          assert list(model.feature_names_in_) == REQUIRED_COLUMNS
          PY
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/PaleoVeg
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  complete-github-draft:
    name: Attach distributions to the prepared release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"
      # Publish the completed draft in GitHub after checking Zenodo connectivity.
      # Keeping it as a draft prevents Zenodo ingesting an incomplete release.
