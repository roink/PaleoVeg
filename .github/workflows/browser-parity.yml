name: Browser prediction parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "paleoveg/**"
      - "tests/**"
      - "scripts/verify_browser_parity.py"
      - "docs/pyodide-worker.mjs"
      - "docs/assets/*.whl"
      - ".github/workflows/browser-parity.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install . pytest selenium
      - run: pytest -q
      - name: Download released classifier
        run: >-
          curl --fail --location --retry 3
          --output docs/assets/model.pkl.bz2
          https://github.com/roink/PaleoVeg/releases/download/v0.1.2/model.pkl.bz2
      - name: Verify classifier checksum
        run: >-
          echo "7ad80d07f91c2c0c51b1cad9f423056d24daf07ea70b7ab04ba4502d38d1fab6  docs/assets/model.pkl.bz2"
          | sha256sum --check
      - run: python scripts/verify_browser_parity.py
