name: Browser prediction parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "paleoveg/**"
      - "tests/**"
      - "scripts/verify_browser_parity.py"
      - "docs/pyodide-worker.mjs"
      - "docs/assets/*.whl"
      - ".github/workflows/browser-parity.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install '.[browser-test]'
      - run: pytest -q
      - name: Download and verify the release classifier
        run: python scripts/download_release_model.py
      - run: python scripts/verify_browser_parity.py
